name: playstead

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playstead}
      POSTGRES_USER: ${POSTGRES_USER:-playstead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - playstead-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      target: backend
    restart: 'no'
    environment: &backend-environment
      NODE_ENV: production
      PORT: 3005
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-playstead}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-playstead}
      REDIS_URL: redis://redis:6379
      DAILY_TIME_ZONE: ${DAILY_TIME_ZONE:-UTC}
      MATCH_ROUND_SECONDS: ${MATCH_ROUND_SECONDS:-45}
      MATCH_REVEAL_SECONDS: ${MATCH_REVEAL_SECONDS:-8}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@playstead/backend', 'migration:run']

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - '3005'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3005/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_SATELLITE_TILE_URL: ${VITE_SATELLITE_TILE_URL:-}
        VITE_SATELLITE_TILE_ATTRIBUTION: ${VITE_SATELLITE_TILE_ATTRIBUTION:-}
        VITE_SATELLITE_TILE_MAX_ZOOM: ${VITE_SATELLITE_TILE_MAX_ZOOM:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${PLAYSTEAD_PORT:-8080}:8080'

volumes:
  playstead-postgres:
