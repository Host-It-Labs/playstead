# Development-only host access for the database services. The startup script supplies
# isolated ports and a unique Compose project for each linked worktree.
services:
  postgres:
    ports:
      - '127.0.0.1:${PLAYSTEAD_DB_PORT:-55432}:5432'

  redis:
    ports:
      - '127.0.0.1:${PLAYSTEAD_REDIS_PORT:-56379}:6379'
