name: Bug report
description: Report a reproducible Playstead defect without private data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or vulnerability details.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Atlas Drop, Accounts, Live tables, Chat, Self-hosting, Backend]
    validations:
      required: true
